name: Build plugin

on:
  push:
    branches: [ main, release-2024.3 ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: buildPlugin (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches ~/.gradle, which includes the IntelliJ Platform distribution that the
      # IntelliJ Platform Gradle Plugin downloads on the first run (~700 MB).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No local IDE needed: without -PlocalIdePath the build downloads IntelliJ IDEA
      # 2024.3.6 from the JetBrains repository and compiles against it with Java 21.
      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: smart-request-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      # The tests open real Swing windows (JFrame), so they need a virtual display.
      # They are not part of buildPlugin; run them explicitly when needed:
      #
      #   - name: Run tests
      #     run: xvfb-run --auto-servernum ./gradlew test

  # Pushing a tag such as v1.0.1 builds the plugin and publishes a GitHub release
  # with the zip attached.
  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release` resolves the repository through git; without a checkout it fails with
      # "failed to run git: fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin zip
        uses: actions/download-artifact@v4
        with:
          name: smart-request-plugin
          path: build/distributions

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            # Re-running the workflow for the same tag: replace the attached zip.
            gh release upload "$tag" build/distributions/*.zip --repo "$repo" --clobber
          else
            gh release create "$tag" build/distributions/*.zip \
              --repo "$repo" \
              --title "$tag" \
              --generate-notes
          fi
